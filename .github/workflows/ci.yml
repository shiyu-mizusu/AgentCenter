name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write  # to publish releases on tags
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh --zip
          gh release create "$GITHUB_REF_NAME" "build/AgentCenter-${GITHUB_REF_NAME#v}.zip" --generate-notes
